name: Daily shelter update
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = about 6am Pacific
  workflow_dispatch:        # adds the "Run workflow" button
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch adoptable animals
        env:
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: python scripts/update.py
      - name: Save today's listings
        run: |
          git config user.name "shelter-bot"
          git config user.email "shelter-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi

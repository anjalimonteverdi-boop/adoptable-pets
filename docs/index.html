<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch Feed</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Fetch Feed">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="description" content="Adoptable dogs and cats from local shelters, updated every morning.">
<style>
  :root {
    --bg: #ffffff; --text: #4a3a2e; --muted: #9a8775; --line: #eee6dc; --field: #f7f3ee;
    color-scheme: light;
    --brown: #6b4a32; --tan: #b07d4b; --tan-soft: #f0e3d4; --accent: #3b82c4; --accent-text: #fff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 500 16px/1.45 Quicksand, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }

  header { padding: 22px 0 6px; }
  body { border-top: 5px solid #c9955f; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 50px; height: 50px; }
  h1 { margin: 0; font: 700 2rem/1 Quicksand, system-ui, sans-serif; color: #a0703f; }
  h1 span { color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .account { display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--muted); min-width: 0; }
  #who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .acctbtn { border: 0; background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 7px 16px;
             font-weight: 700; cursor: pointer; white-space: nowrap; }
  .acctbtn.quiet { background: var(--field); color: var(--brown); border: 1.5px solid var(--tan-soft); }
  .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 600; }
  dialog { border: 0; border-radius: 18px; padding: 22px; width: min(420px, calc(100vw - 32px));
           box-shadow: 0 10px 40px rgba(0,0,0,.2); color: var(--text); }
  dialog::backdrop { background: rgba(47,34,25,.35); }
  dialog .note { color: var(--muted); font-size: .9rem; margin: 0; }
  dialog h2 { margin: 0 0 4px; font-size: 1.2rem; color: var(--brown); }
  dialog input { width: 100%; margin: 14px 0 12px; }
  .dlgrow { display: flex; justify-content: flex-end; gap: 10px; }
  @media (max-width: 560px) { #who { display: none; } }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

  .controls { background: var(--bg); padding: 12px 0; }
  @media (min-width: 700px) { .controls { position: sticky; top: 0; z-index: 5; } }
  .controls .wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs { display: inline-flex; background: var(--field); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: none; color: var(--tan); padding: 7px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; }
  .tabs button[aria-pressed=true] { background: var(--accent); color: var(--accent-text); }
  input, select { border: 1.5px solid var(--tan-soft); color: var(--brown); background: var(--field); border-radius: 999px; padding: 9px 16px; }
  input { flex: 1 1 200px; min-width: 0; }
  select { cursor: pointer; flex: 0 0 190px; min-width: 0; padding-right: 10px; }
  input::placeholder { color: var(--tan); opacity: .8; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .count { display: flex; align-items: center; gap: 10px; color: var(--tan); font-weight: 600; font-size: .9rem; margin: 4px 0 14px; }
  /* Swipe feed: one pet per screen, like TikTok or Reels. */
  .feed { position: fixed; inset: 0; z-index: 20; background: #120d0a; overflow-y: auto;
          scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .slide { position: relative; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
           overflow: hidden; display: grid; place-items: center; color: #fff; }
  .slide .blur { position: absolute; inset: -30px; background-size: cover; background-position: center;
                 filter: blur(20px) brightness(.55); transform: translateZ(0); }
  .slide .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide .nopic { position: relative; width: 40%; opacity: .5; }
  .slide .shade { position: absolute; inset: auto 0 0 0; height: 45%;
                  background: linear-gradient(transparent, rgba(0,0,0,.75)); pointer-events: none; }
  .slide .info { position: absolute; left: 18px; right: 86px; bottom: max(28px, env(safe-area-inset-bottom)); }
  .slide .pname { font: 700 2rem/1.05 Quicksand, system-ui, sans-serif; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .slide .pmeta { margin-top: 6px; font-weight: 600; opacity: .92; }
  .slide .chip { display: inline-block; background: var(--accent); color: #fff; font-size: .78rem; font-weight: 700;
                 padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
  .slide .meet { display: inline-block; margin-top: 14px; background: #fff; color: var(--brown); font-weight: 700;
                 padding: 10px 18px; border-radius: 999px; text-decoration: none; }
  .rail { position: absolute; right: 14px; bottom: max(36px, env(safe-area-inset-bottom)); display: grid; gap: 18px; justify-items: center; }
  .rail button { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
                 background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(6px); }
  .rail button svg { width: 28px; height: 28px; }
  .rail .heart { position: static; box-shadow: none; color: #fff; }
  .rail small { display: block; font-size: .72rem; font-weight: 700; margin-top: 4px; text-align: center; }
  .rail .heart[aria-pressed=true] { color: #ff4d6d; }
  .rail .heart[aria-pressed=true] path { fill: currentColor; }
  .burst { position: absolute; width: 120px; height: 120px; color: #ff4d6d; pointer-events: none;
           animation: burst .8s ease-out forwards; }
  .burst path { fill: currentColor; stroke: none; }
  @keyframes burst { 0% { transform: scale(.3); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; }
                     60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  .feedbar { position: fixed; top: 0; left: 0; right: 0; z-index: 21; display: flex; align-items: center; gap: 8px;
             padding: max(12px, env(safe-area-inset-top)) 14px 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .feedbar .ff { white-space: nowrap; font: 700 1.1rem/1 Quicksand, system-ui, sans-serif; color: #fff; margin-right: auto; display: flex; align-items: center; gap: 6px; }
  .feedbar .ff img { width: 26px; height: 26px; }
  .feedbar button { border: 0; border-radius: 999px; padding: 6px 11px; font-weight: 700; cursor: pointer;
                    background: rgba(255,255,255,.18); color: #fff; backdrop-filter: blur(6px); }
  .feedbar button[aria-pressed=true] { background: #fff; color: var(--brown); }
  .feedend { height: 100dvh; scroll-snap-align: start; display: grid; place-items: center; text-align: center; color: #fff; padding: 24px; }
  .feedend button { margin-top: 12px; border: 0; background: #fff; color: var(--brown); font-weight: 700; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  body.feeding { overflow: hidden; }
  body.feeding header, body.feeding nav, body.feeding .count, body.feeding .viewrow, body.feeding #grid, body.feeding footer { display: none; }
  @media (max-width: 430px) { .fftext { display: none; } }
  .views { display: flex; gap: 4px; background: var(--field); border-radius: 999px; padding: 4px; margin: 0 0 18px; width: max-content; max-width: 100%; }
  .views button { display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--brown); font: inherit; font-weight: 700;
                  font-size: .88rem; padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .views svg { width: 16px; height: 16px; fill: currentColor; }
  .views button[aria-pressed=true] { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .views[hidden] { display: none; }
  .viewrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 18px; }
  .viewrow .views { margin: 0; }
  .swipego { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
             font: inherit; font-weight: 700; font-size: .92rem; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
  .swipego svg { width: 15px; height: 15px; fill: currentColor; }
  .swipego[hidden] { display: none; }
  .grid.list { grid-template-columns: 1fr; gap: 0; }
  .grid.list .card { display: flex; align-items: center; border-bottom: 1px solid var(--tan-soft); padding: 10px 0; }
  .grid.list .card > a { display: grid; grid-template-columns: 76px 1fr; grid-template-rows: auto auto auto; column-gap: 14px; align-items: center; flex: 1; min-width: 0; }
  .grid.list .photo { grid-row: 1 / 4; width: 76px; border-radius: 12px; }
  .grid.list .name { margin: 0; align-self: end; }
  .grid.list .meta { align-self: start; }
  .grid.list .orgline { display: block; color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: start; }
  .grid.list .new { top: 4px; left: 4px; font-size: .62rem; padding: 2px 6px; }
  .grid.list .heart { position: static; flex: none; box-shadow: none; background: var(--field); margin-left: 10px; }
  .grid.list .card:hover .photo { box-shadow: none; }
  .orgline { display: none; }
  .shelters .sgroup + .sgroup { margin-top: 34px; }
  .sgroup h2 { font-size: 1.15rem; color: var(--brown); margin: 0 0 2px; }
  .sgroup .shint { color: var(--muted); font-size: .88rem; margin: 0 0 12px; }
  .sgroup .shint a { color: var(--accent); }
  .count .share { margin-left: auto; white-space: nowrap; border: 1.5px solid var(--accent); border-radius: 999px; padding: 5px 14px; font-weight: 700; }
  .count button, .empty button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
  .grid { display: grid; gap: 22px 16px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card { position: relative; min-width: 0; }
  .card > a { color: inherit; text-decoration: none; display: block; }
  .heart { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border: 0; border-radius: 50%;
           background: rgba(255,255,255,.92); color: var(--tan); cursor: pointer; display: grid; place-items: center;
           box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .heart svg { width: 20px; height: 20px; }
  .heart[aria-pressed=true] { color: #d9534f; }
  .heart[aria-pressed=true] path { fill: currentColor; }
  .count .favbtn { white-space: nowrap; border: 1.5px solid var(--tan-soft); background: var(--field); color: var(--brown); border-radius: 999px;
            padding: 5px 14px; font-weight: 700; cursor: pointer; }
  .count #share[hidden] + .favbtn { margin-left: auto; }
  .count .favbtn[aria-pressed=true] { background: var(--tan); border-color: var(--tan); color: #fff; }
  .syncnote { background: var(--field); border-radius: 12px; padding: 10px 14px; color: var(--brown); font-size: .9rem; margin: 0 0 16px; }
  .syncnote .linkbtn { padding: 0; }
  .favsec h2 { font-size: 1.15rem; color: var(--brown); margin: 8px 0 12px; }
  .favsec + .favsec { margin-top: 32px; }
  .gone { position: absolute; bottom: 8px; left: 8px; background: rgba(74,51,36,.85); color: #fff;
          font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .photo { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--field); }
  .photo::before { content: ""; position: absolute; inset: 30%; background: url(logo-mark.svg) center / contain no-repeat; opacity: .35; }
  .photo img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .card:hover img { transform: scale(1.03); }
  .card:hover .photo { box-shadow: 0 0 0 3px var(--tan); }
  .new { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-text);
         font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .name { font-weight: 700; margin-top: 8px; color: var(--brown); }
  .kind { color: var(--tan); font-weight: 600; }
  .meta { color: var(--muted); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--muted); }

  footer { color: var(--muted); font-size: .85rem; padding: 24px 0 40px; margin-top: 40px; border-top: 1px solid var(--tan-soft); }
  footer button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }

  @media (max-width: 560px) {
    .tabs { flex: 1; } .tabs button { flex: 1; padding: 7px 0; }
    input { flex-basis: 100%; order: 1; }
    select { flex: 1 1 0; min-width: 0; order: 2; }
    #org { flex-basis: 100%; }
    .brand img { width: 42px; height: 42px; } h1 { font-size: 1.7rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; }
    .views, .swipego { width: 100%; } .views button { flex: 1; justify-content: center; padding: 7px 4px; gap: 4px; font-size: .8rem; }
  }
  @media (max-width: 380px) { .views svg { display: none; } }
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <div class="brand"><img src="logo.svg" alt=""><h1 id="title">Fetch <span>Feed</span></h1></div>
    <div class="account" id="account" hidden>
      <span id="who" hidden></span>
      <button class="acctbtn" id="signin">Sign in</button>
    </div>
  </div>
  <p class="sub" id="sub">Adoptable dogs and cats at local shelters.</p>
</header>

<nav class="controls" aria-label="Filters">
  <div class="wrap">
    <div class="tabs" role="group" aria-label="Dogs or cats" id="species">
      <button data-v="">All</button><button data-v="Dog">Dogs</button><button data-v="Cat">Cats</button>
    </div>
    <input type="search" id="q" placeholder="Search by name" aria-label="Search by name">
    <select id="area" aria-label="Area" hidden></select>
    <select id="org" aria-label="Shelter"></select>
    <select id="age" aria-label="Age"></select>
    <select id="sex" aria-label="Sex"></select>
    <select id="size" aria-label="Size"></select>
    <select id="sort" aria-label="Sort"><option value="">Newest</option><option value="near">Closest to me</option><option value="old">Oldest first</option><option value="young">Youngest first</option></select>
  </div>
</nav>

<main class="wrap">
  <div class="count"><span id="count" aria-live="polite"></span> <button id="clear" hidden>Clear</button><button class="share" id="share">Share</button><button class="favbtn" id="favs" aria-pressed="false">&#9829; Favorites</button></div>
  <div class="viewrow">
  <div class="views" role="group" aria-label="View" id="views">
    <button data-view="grid"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Grid</button><button data-view="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v4H4zM10 6h10v2H10zM4 10.5h4v4H4zM10 11.5h10v2H10zM4 16h4v4H4zM10 17h10v2H10z"/></svg>List</button><button data-view="shelter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>By shelter</button></div>
  <button class="swipego" id="swipego" data-view="feed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>Tap to activate swipe mode</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="favview" hidden></div>
  <div class="feedbar" id="feedbar" hidden>
    <span class="ff"><img src="logo.svg" alt="Fetch Feed"><span class="fftext">Fetch Feed</span></span>
    <button data-v="">All</button><button data-v="Dog">Dogs</button><button data-v="Cat">Cats</button>
    <button id="feedfavs" aria-label="Favorites">&#9829;</button>
    <button id="togrid" aria-label="Show as grid">&#9638;</button>
  </div>
  <div class="feed" id="feed" hidden></div>
  <footer>
    <span id="source">Updated every morning.</span> Tap a pet to adopt through its shelter.
  </footer>
</main>

<dialog id="signdlg">
  <form id="signform" method="dialog">
    <h2>Sign in to save favorites</h2>
    <p class="note">We'll email you a link. Tap it and you're signed in. No password needed.</p>
    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" aria-label="Email">
    <div class="dlgrow"><button type="button" class="linkbtn" id="signcancel">Cancel</button><button class="acctbtn" id="signsend">Email me a link</button></div>
    <p class="note" id="signmsg" aria-live="polite"></p>
  </form>
</dialog>

<script src="vendor/supabase-js-2.45.4.js"></script>
<script>
// Sign-in service (Supabase). The URL and the "anon public" key are meant to be public;
// each person's favorites are protected by the database's row rules. Empty = accounts off.
const SUPABASE_URL = "https://epewylkpqxopitqlynld.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwZXd5bGtwcXhvcGl0cWx5bmxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NDY1NjAsImV4cCI6MjEwOTIyMjU2MH0.ZDdTUa_ZlRTZRFDTX046ojshepUZMm5pBypbCULkXlE";
const $ = (id) => document.getElementById(id);
const AGE_ORDER = ["Baby", "Young", "Adult", "Senior"];
const SIZE_ORDER = ["Small", "Medium", "Large", "X-Large"];
const FILTERS = ["org", "age", "sex", "size"];
const AGE_LABEL = { Baby: "Puppy or kitten (under 1)", Young: "Young (1 to 3 years)", Adult: "Adult (3 to 8 years)", Senior: "Senior (8+ years)" };
const ANY = { org: "All shelters", age: "Any age", sex: "Any sex", size: "Any size" };
let data = null, areas = [];
const state = { area: "", species: "", org: "", age: "", sex: "", size: "", q: "", sort: "", fav: "", view: "" };
let here = null;  // the visitor's location, once they allow it

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(state)) if (p.has(k)) state[k] = p.get(k);
}
function writeHash() {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v && !(k === "area" && areas.length < 2)) p.set(k, v);
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const valOf = (a, k) => k === "org" ? a.org.name : a[k];
// Age in months; when a shelter gives only the age group, the middle of that group.
const ageOf = a => a.age_months ?? { Baby: 6, Young: 24, Adult: 66, Senior: 120 }[a.age];
// Shelters are grouped region > area > subarea; the shelter menu can pick any level.
const PLACES = ["region", "metro", "subarea"];
const orgMatch = (a, v) => { const i = v.indexOf(":"), lvl = v.slice(0, i);
  return PLACES.includes(lvl) ? a.org[lvl] === v.slice(i + 1) : a.org.name === v; };
const kindOf = a => a.age === "Baby" ? (a.species === "Dog" ? "Puppy" : "Kitten") : a.species;

function matches(a) {
  const q = state.q.trim().toLowerCase();
  return (!state.species || a.species === state.species) &&
    FILTERS.every(k => !state[k] || (k === "org" ? orgMatch(a, state[k]) : valOf(a, k) === state[k])) &&
    (!q || (a.name + " " + a.breed).toLowerCase().includes(q));
}

function buildOrgs() {
  const pad = n => "\u00a0\u00a0\u00a0".repeat(n), opts = [new Option("All of California", "")], tree = {};
  for (const a of data.animals) {
    const o = a.org, r = o.region || "Other", ar = o.metro || "", sub = o.subarea || "";
    ((((tree[r] ||= {})[ar] ||= {})[sub] ||= new Set())).add(o.name);
  }
  const values = [""];
  const add = (label, value, depth) => { opts.push(new Option(pad(depth) + label, value)); values.push(value); };
  for (const r of ["Northern California", "Central Valley", "Southern California", ...Object.keys(tree)].filter((x, i, l) => l.indexOf(x) === i)) {
    if (!tree[r]) { const o = new Option(`${r} (coming soon)`, ""); o.disabled = true; opts.push(o); continue; }
    add(r, `region:${r}`, 0);
    for (const ar of Object.keys(tree[r]).sort()) {
      if (ar) add(ar, `metro:${ar}`, 1);
      for (const sub of Object.keys(tree[r][ar]).sort()) {
        const d = ar ? 2 : 1;
        if (sub) add(sub, `subarea:${sub}`, d);
        for (const name of [...tree[r][ar][sub]].sort()) add(name, name, d + (sub ? 1 : 0));
      }
    }
  }
  if (!values.includes(state.org)) state.org = "";
  $("org").replaceChildren(...opts);
  $("org").value = state.org;
}

function buildSelects() {
  buildOrgs();
  for (const k of FILTERS.filter(k => k !== "org")) {
    const values = [...new Set(data.animals.map(a => valOf(a, k)).filter(Boolean))];
    const order = k === "age" ? AGE_ORDER : k === "size" ? SIZE_ORDER : null;
    values.sort((x, y) => order ? order.indexOf(x) - order.indexOf(y) : x.localeCompare(y));
    if (!values.includes(state[k])) state[k] = "";
    // Hide a filter with nothing to choose (shelter websites don't give sex or size).
    $(k).hidden = values.length < (k === "age" ? 1 : 2);
    $(k).replaceChildren(new Option(ANY[k], ""),
      ...values.map(v => new Option(k === "age" ? AGE_LABEL[v] || v : v, v)));
    $(k).value = state[k];
  }
}

function render() {
  for (const b of $("species").children) b.setAttribute("aria-pressed", b.dataset.v === state.species);
  const list = data.animals.filter(matches)
    .sort((a, b) => b.first_seen.localeCompare(a.first_seen) || a.name.localeCompare(b.name));
  if (state.sort === "near") list.sort((a, b) => (milesTo(a) ?? 1e9) - (milesTo(b) ?? 1e9));
  // Pets with no age at all go last either way.
  if (state.sort === "old") list.sort((a, b) => (ageOf(b) ?? -1) - (ageOf(a) ?? -1));
  if (state.sort === "young") list.sort((a, b) => (ageOf(a) ?? 1e9) - (ageOf(b) ?? 1e9));
  $("sort").value = state.sort;
  const filtered = Object.entries(state).some(([k, v]) => !["area", "sort", "fav", "view"].includes(k) && v);
  $("count").textContent = `${list.length.toLocaleString()} ${list.length === 1 ? "pet" : "pets"}`;
  $("clear").hidden = !filtered;
  const view = currentView();
  for (const b of $("views").children) b.setAttribute("aria-pressed", b.dataset.view === view);
  $("views").hidden = $("swipego").hidden = state.fav === "1";
  $("grid").className = view === "list" ? "grid list" : view === "shelter" ? "shelters" : "grid";
  const cards = l => l.map(a => card(a, a.new ? "New" : "")).join("");
  $("grid").innerHTML = !list.length ? `<p class="empty">No pets match. <button onclick="clearFilters()">Show all</button></p>`
    : view !== "shelter" ? cards(list)
    : [...new Set(list.map(a => a.org.name))].map(name => {
        const pets = list.filter(a => a.org.name === name), o = pets[0].org;
        return `<section class="sgroup"><h2>${esc(name)}</h2>
          <p class="shint">${esc(o.city || "")}${o.city ? " · " : ""}${pets.length} ${pets.length === 1 ? "pet" : "pets"}${o.url ? ` · <a href="${esc(o.url)}" target="_blank" rel="noopener">Website</a>` : ""}</p>
          <div class="grid">${cards(pets)}</div></section>`;
      }).join("");
  renderFavs();
  renderFeed(list);
  writeHash();
}

const SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Phones open in the swipe feed; computers in the grid. Either can switch.
const VIEWS = ["grid", "list", "shelter", "feed"];
// The home-screen app always opens in the swipe feed; the website picks by screen size.
const asApp = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const currentView = () => VIEWS.includes(state.view) ? state.view
  : asApp || matchMedia("(max-width: 700px)").matches ? "feed" : "grid";
const feedOn = () => currentView() === "feed";
let feedKey = "";

function renderFeed(list) {
  const on = feedOn() && state.fav !== "1";
  $("feed").hidden = $("feedbar").hidden = !on;
  document.body.classList.toggle("feeding", on);
  if (!on) { feedKey = ""; return; }
  for (const b of $("feedbar").querySelectorAll("[data-v]")) b.setAttribute("aria-pressed", b.dataset.v === state.species);
  const key = list.map(a => a.id).join();
  if (key === feedKey) {  // same pets: just refresh the hearts, keep the scroll spot
    for (const b of $("feed").querySelectorAll(".heart")) b.setAttribute("aria-pressed", !!favs[b.dataset.id]);
    return;
  }
  feedKey = key;
  $("feed").innerHTML = list.map(a => `
    <section class="slide" data-id="${esc(a.id)}">
      ${a.photo ? `<div class="blur"></div><img class="pic" data-src="${esc(a.photo)}" alt="${esc(a.name)}" referrerpolicy="no-referrer">`
                : `<img class="nopic" src="logo-mark.svg" alt="">`}
      <div class="shade"></div>
      <div class="info">
        ${a.new ? `<span class="chip">New today</span>` : ""}
        <div class="pname">${esc(a.name)}</div>
        <div class="pmeta">${esc(kindOf(a))}${a.age_text ? `, ${esc(a.age_text)}` : ""} · ${esc(a.org.name)}${a.org.city ? `, ${esc(a.org.city)}` : ""}${milesTo(a) != null ? ` · ${Math.round(milesTo(a))} mi` : ""}</div>
        <a class="meet" href="${esc(a.url)}" target="_blank" rel="noopener">Meet ${esc(a.name)} &rarr;</a>
      </div>
      <div class="rail">
        <div><button class="heart" data-id="${esc(a.id)}" aria-pressed="${!!favs[a.id]}" aria-label="Save ${esc(a.name)}">${HEART}</button><small>Save</small></div>
        <div><button class="sharepet" data-id="${esc(a.id)}" aria-label="Share ${esc(a.name)}">${SHARE}</button><small>Share</small></div>
      </div>
    </section>`).join("") + `<div class="feedend"><div><p>That's everyone for now.<br>New pets show up every morning.</p>
      <button onclick="$('feed').scrollTo({top: 0, behavior: 'smooth'})">Back to the top</button></div></div>`;
  $("feed").scrollTop = 0;
  for (const s of $("feed").querySelectorAll(".slide")) nearby.observe(s);
}

// Only the slides on or next to the screen hold their photos. Loading all of them at once (each with a blurred
// copy behind it) used up the phone's memory and made iPhones close the page.
const nearby = new IntersectionObserver(entries => {
  for (const { target, isIntersecting } of entries) {
    const img = target.querySelector(".pic"), blur = target.querySelector(".blur");
    if (!img) continue;
    if (isIntersecting) {
      if (!img.getAttribute("src")) {
        img.onerror = () => { if (!img.getAttribute("src")) return; img.onerror = null; img.removeAttribute("data-src"); img.src = "logo-mark.svg"; img.className = "nopic"; blur.remove(); };
        img.src = img.dataset.src;
        blur.style.backgroundImage = `url("${img.dataset.src}")`;
      }
    } else if (img.dataset.src && img.getAttribute("src")) {
      img.removeAttribute("src"); blur.style.backgroundImage = "";
    }
  }
}, { root: $("feed"), rootMargin: "100% 0px" });

// Double-tap a photo to save, like Instagram (timed by hand, since phones don't
// always send a double-click).
let lastTap = 0;
$("feed").addEventListener("pointerup", e => {
  const now = Date.now(), double = now - lastTap < 320;
  lastTap = double ? 0 : now;
  if (!double) return;
  const slide = e.target.closest(".slide"); if (!slide || e.target.closest("a, button")) return;
  const id = slide.dataset.id;
  if (!favs[id]) toggleFav(id);
  const b = document.createElement("div");
  b.className = "burst"; b.innerHTML = HEART;
  slide.append(b); setTimeout(() => b.remove(), 800);
});

async function sharePet(id) {
  const a = data.animals.find(x => x.id === id); if (!a) return;
  const text = `Meet ${a.name}, a ${kindOf(a).toLowerCase()} up for adoption at ${a.org.name}. Found on Fetch Feed 🐾`;
  try { if (navigator.share) return await navigator.share({ title: a.name, text, url: a.url }); } catch (e) { return; }
  try { await navigator.clipboard.writeText(`${text} ${a.url}`); alert("Link copied. Paste it anywhere to share."); }
  catch (e) { prompt("Copy this link:", a.url); }
}

const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 4.4 2.5C11.8 6.2 13.3 5 15.4 5 19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';

function card(a, tag, gone) {
  const saved = !!favs[a.id];
  return `<div class="card">
    <a href="${esc(a.url)}" target="_blank" rel="noopener">
      <div class="photo">
        ${a.photo ? `<img src="${esc(a.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
        ${tag ? `<span class="new">${tag}</span>` : ""}
        ${gone ? `<span class="gone">No longer listed</span>` : ""}
      </div>
      <div class="name">${esc(a.name)}</div>
      <div class="meta" title="${esc(a.org.name)}"><span class="kind">${esc(kindOf(a))}</span>${a.age_text ? ` · ${esc(a.age_text)}` : ""} · ${esc(a.org.city || a.org.name)}${state.sort === "near" && milesTo(a) != null ? ` · ${Math.round(milesTo(a))} mi` : ""}</div>
      <div class="orgline">${esc(a.org.name)}</div>
    </a>
    <button class="heart" data-id="${esc(a.id)}" aria-pressed="${saved}" aria-label="${saved ? "Remove" : "Save"} ${esc(a.name)} ${saved ? "from" : "to"} favorites">${HEART}</button>
  </div>`;
}

// Favorites are kept in this browser, and in the person's account when signed in. Each one keeps a copy of the pet, so it
// still shows after the pet leaves the listings (most likely adopted).
const FAV_KEY = "fetchfeed-favorites";
let favs = {};
try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || {}; } catch (e) { favs = {}; }
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {} }
function toggleFav(id) {
  if (favs[id]) delete favs[id];
  else {
    const a = data.animals.find(x => x.id === id); if (!a) return;
    favs[id] = { id: a.id, name: a.name, species: a.species, age: a.age, photo: a.photo, url: a.url,
                 org: { name: a.org.name, city: a.org.city }, saved: new Date().toISOString() };
  }
  saveFavs(); render();
  if (user) {
    const req = favs[id]
      ? sb.from("favorites").upsert({ pet_id: id, pet: favs[id], saved_at: favs[id].saved })
      : sb.from("favorites").delete().eq("pet_id", id);
    req.then(({ error }) => error && console.warn("Couldn't sync favorite:", error.message));
  }
}

// ---- Accounts: email sign-in link; favorites follow the person across devices ----
let sb = null, user = null;

async function pullFavs() {
  // Anything saved on this device before signing in joins the account.
  const { data: rows, error } = await sb.from("favorites").select("pet_id, pet, saved_at");
  if (error) return console.warn("Couldn't load favorites:", error.message);
  const remote = Object.fromEntries(rows.map(r => [r.pet_id, { ...r.pet, saved: r.saved_at }]));
  const onlyHere = Object.values(favs).filter(f => !remote[f.id]);
  if (onlyHere.length) {
    await sb.from("favorites").upsert(onlyHere.map(f => ({ pet_id: f.id, pet: f, saved_at: f.saved })));
  }
  favs = { ...remote, ...Object.fromEntries(onlyHere.map(f => [f.id, f])) };
  saveFavs(); if (data) render();
}

function showUser() {
  $("who").hidden = !user;
  $("who").textContent = user ? user.email : "";
  $("signin").textContent = user ? "Sign out" : "Sign in";
  $("signin").classList.toggle("quiet", !!user);
}

function setupAccounts() {
  if (!SUPABASE_URL || !window.supabase) return;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  $("account").hidden = false;
  sb.auth.onAuthStateChange((event, session) => {
    const was = user && user.id;
    user = session ? session.user : null;
    showUser();
    if (data) render();
    if (user && user.id !== was) pullFavs();
    if (event === "SIGNED_OUT") { favs = {}; saveFavs(); if (data) render(); }
  });
  $("signin").addEventListener("click", () => {
    if (user) return sb.auth.signOut();
    $("signmsg").textContent = ""; $("signsend").disabled = false;
    $("signdlg").showModal(); $("email").focus();
  });
  $("signcancel").addEventListener("click", () => $("signdlg").close());
  $("signform").addEventListener("submit", async e => {
    e.preventDefault();
    $("signsend").disabled = true; $("signmsg").textContent = "Sending…";
    const { error } = await sb.auth.signInWithOtp({
      email: $("email").value.trim(),
      options: { emailRedirectTo: location.origin + location.pathname },
    });
    $("signmsg").textContent = error
      ? "That didn't work: " + error.message
      : "Check your email and tap the link. You can close this.";
    $("signsend").disabled = false;
  });
}

function renderFavs() {
  const n = Object.keys(favs).length, on = state.fav === "1";
  $("favs").innerHTML = on ? "&larr; All pets" : `&#9829; Favorites${n ? ` (${n})` : ""}`;
  $("favs").setAttribute("aria-pressed", on);
  $("grid").hidden = on; $("favview").hidden = !on; $("share").hidden = on;
  document.querySelector(".controls").hidden = on;
  if (!on) return;
  $("count").textContent = "Your favorites";
  $("clear").hidden = true;
  const live = Object.fromEntries(data.animals.map(a => [a.id, a]));
  const all = Object.values(favs).sort((a, b) => b.saved.localeCompare(a.saved));
  const nudge = sb && !user ? `<p class="syncnote">Favorites are saved on this device. <button class="linkbtn" onclick="$('signin').click()">Sign in</button> to keep them on all your devices.</p>` : "";
  $("favview").innerHTML = nudge + (n ? [["Dog", "Dogs"], ["Cat", "Cats"]].map(([sp, title]) => {
    const list = all.filter(f => f.species === sp);
    return `<section class="favsec"><h2>${title} (${list.length})</h2>${list.length
      ? `<div class="grid">${list.map(f => card(live[f.id] || f, "", !live[f.id])).join("")}</div>`
      : `<p class="meta">No ${title.toLowerCase()} saved yet.</p>`}</section>`;
  }).join("") : `<p class="empty">Tap the &#9829; on any pet to save it here.<br><button onclick="state.fav='';render()">Browse pets</button></p>`);
}

// Miles from the visitor if they shared their location, otherwise from the area's center.
function milesTo(a) {
  if (!here || a.org.lat == null) return a.distance;
  const r = Math.PI / 180, dLat = (a.org.lat - here.lat) * r, dLon = (a.org.lon - here.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(here.lat * r) * Math.cos(a.org.lat * r) * Math.sin(dLon / 2) ** 2;
  return 7917.6 * Math.asin(Math.sqrt(h));
}

function clearFilters() {
  Object.assign(state, { species: "", org: "", age: "", sex: "", size: "", q: "" });
  $("q").value = "";
  for (const k of FILTERS) $(k).value = "";
  render();
}

async function loadArea(id) {
  const res = await fetch(`data/${encodeURIComponent(id)}.json`, { cache: "no-cache" });
  if (!res.ok) throw new Error("missing data");
  data = await res.json();
  state.area = id;
  const updated = new Date(data.updated + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  $("sub").textContent = `Dogs and cats ready to adopt in the ${data.area.name.replace(/^San Francisco /, "")}. Updated ${updated}.`;
  $("source").textContent = data.source === "shelter websites"
    ? "Listings come from each shelter's website and refresh every morning."
    : "Listings come from RescueGroups.org and refresh every morning.";
  $("q").value = state.q;
  buildSelects();
  render();
}

async function init() {
  readHash();
  try {
    const idx = await (await fetch("data/areas.json", { cache: "no-cache" })).json();
    areas = idx.areas;
    if (areas.length > 1) {
      $("area").hidden = false;
      for (const a of areas) $("area").append(new Option(a.name, a.id));
    }
    const pick = areas.find(a => a.id === state.area) || areas[0];
    $("area").value = pick.id;
    await loadArea(pick.id);
  } catch (e) {
    $("sub").textContent = "No listings yet. They appear after the first daily update runs.";
  }
}

$("species").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.species = b.dataset.v; render();
});
for (const k of FILTERS) $(k).addEventListener("change", e => { state[k] = e.target.value; render(); });
$("sort").addEventListener("change", e => {
  state.sort = e.target.value; render();
  if (state.sort === "near" && !here && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(p => {
      here = { lat: p.coords.latitude, lon: p.coords.longitude }; render();
    }, () => {}, { maximumAge: 600000, timeout: 15000 });
  }
});
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("clear").addEventListener("click", clearFilters);
$("swipego").addEventListener("click", () => { state.view = "feed"; state.fav = ""; render(); });
$("views").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  state.view = b.dataset.view; state.fav = ""; render(); if (b.dataset.view !== "feed") scrollTo(0, 0);
});
$("feedfavs").addEventListener("click", () => { state.fav = "1"; render(); scrollTo(0, 0); });
$("togrid").addEventListener("click", () => { state.view = "grid"; render(); scrollTo(0, 0); });
$("feedbar").addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  state.species = b.dataset.v; render();
});
$("feed").addEventListener("click", e => { const b = e.target.closest(".sharepet"); if (b) sharePet(b.dataset.id); });
$("favs").addEventListener("click", () => { state.fav = state.fav ? "" : "1"; render(); scrollTo(0, 0); });
document.addEventListener("click", e => {
  const b = e.target.closest(".heart"); if (b) toggleFav(b.dataset.id);
});
// Keep favorites in step when another tab changes them.
addEventListener("storage", e => { if (e.key === FAV_KEY) { try { favs = JSON.parse(e.newValue) || {}; } catch (_) {} render(); } });
$("area").addEventListener("change", e => { state.org = ""; loadArea(e.target.value); });
$("share").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(location.href); $("share").textContent = "Link copied"; }
  catch (e) { prompt("Copy this link:", location.href); }
  setTimeout(() => $("share").textContent = "Share", 2000);
});
setupAccounts();
init();
</script>
</body>
</html>
